server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # HTTPS redirect for production PWA (handled at the TLS/proxy layer in prod).
    # If TLS terminates here, uncomment:
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }

    # Gzip compression (includes PWA manifest)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/manifest+json;
    gzip_min_length 1000;

    # ---------------------------------------------------------------
    # API proxy to backend container
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        client_max_body_size 10M;
    }

    # ---------------------------------------------------------------
    # Member Portal PWA  ->  /member/
    # Files live in /usr/share/nginx/html/member-portal (built with baseHref /member/)
    # ---------------------------------------------------------------

    # Member files are deployed to /usr/share/nginx/html/member so that the
    # on-disk path matches the /member/ URL and nginx `root` resolves cleanly.

    # Service worker: must never be cached so updates roll out immediately.
    location = /member/ngsw-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/member/";
        expires off;
    }
    location = /member/ngsw.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /member/safety-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /member/manifest.json {
        root /usr/share/nginx/html;
        add_header Content-Type application/manifest+json;
        expires 1d;
    }

    # Member SPA routes -> serve the file if it exists, else the SPA shell.
    location /member/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @member_index;

        # Cache fingerprinted static assets aggressively.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # SPA shell for any unmatched /member/ route (deep links, refresh).
    location @member_index {
        root /usr/share/nginx/html;
        try_files /member/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ---------------------------------------------------------------
    # Admin + Public  ->  /  (served from /usr/share/nginx/html/admin-portal)
    # Built with baseHref /. Public landing is at /, admin at /login, /dashboard, etc.
    # ---------------------------------------------------------------
    location / {
        root /usr/share/nginx/html/admin-portal;
        try_files $uri $uri/ /index.html;

        # Never cache the HTML shell.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # Cache fingerprinted static assets aggressively.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
