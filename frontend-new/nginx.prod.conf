# =============================================================
# Production nginx — TLS termination + both Angular frontends
#   /         -> admin + public landing (admin-portal, baseHref /)
#   /member/  -> member PWA (member-portal, baseHref /member/)
#   /api/     -> Spring Boot backend container (service name: backend)
# TLS certs are mounted from the host's Let's Encrypt directory.
# =============================================================

# HTTP -> redirect everything to HTTPS
server {
    listen 80;
    server_name ppvcd.in www.ppvcd.in;

    # Allow ACME HTTP-01 challenges to pass through (certbot renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server
server {
    listen 443 ssl;
    server_name ppvcd.in www.ppvcd.in;

    # ---- TLS (mounted from host /etc/letsencrypt) ----
    ssl_certificate     /etc/letsencrypt/live/ppvcd.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppvcd.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers ----
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- Gzip (includes PWA manifest) ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/manifest+json;
    gzip_min_length 1000;

    # Use Docker's embedded DNS so the backend hostname is resolved at request
    # time (not at startup). Without this, nginx refuses to start if the
    # "backend" container isn't resolvable the instant nginx boots.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------
    # Backend API — proxied to the backend container over the compose network.
    # Backend uses context-path /api, so we pass /api/ straight through.
    # The upstream is held in a variable to force runtime DNS resolution.
    # ---------------------------------------------------------------
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        client_max_body_size 10M;
    }

    # ---------------------------------------------------------------
    # Member PWA  ->  /member/
    # Files deployed to /usr/share/nginx/html/member (matches URL path).
    # ---------------------------------------------------------------
    location = /member/ngsw-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/member/";
        expires off;
    }
    location = /member/ngsw.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /member/safety-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /member/manifest.json {
        root /usr/share/nginx/html;
        add_header Content-Type application/manifest+json;
        expires 1d;
    }

    location /member/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @member_index;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location @member_index {
        root /usr/share/nginx/html;
        try_files /member/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ---------------------------------------------------------------
    # Admin + Public  ->  /
    # Files deployed to /usr/share/nginx/html/admin-portal (baseHref /).
    # ---------------------------------------------------------------
    location / {
        root /usr/share/nginx/html/admin-portal;
        try_files $uri $uri/ /index.html;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
