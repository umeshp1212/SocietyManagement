<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1565c0 0%, #1976d2 50%, #1e88e5 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 6px; }
        .header .reg-number { font-size: 0.9rem; opacity: 0.85; }
        .header .address { font-size: 0.85rem; opacity: 0.75; margin-top: 4px; }

        /* Main Content */
        .main { flex: 1; padding: 40px 20px; max-width: 1200px; margin: 0 auto; width: 100%; }

        .section-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 500;
            color: #1565c0;
            margin-bottom: 30px;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: #1976d2;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* Committee Grid */
        .committee-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        /* Top Row - Chairman, Secretary, Treasurer */
        .top-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin-bottom: 30px;
            width: 100%;
        }

        .member-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 24px 20px;
            text-align: center;
            width: 220px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .member-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .member-card.top-member {
            width: 250px;
            border-top: 3px solid #1976d2;
        }

        .member-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 3px solid #e3f2fd;
        }
        .member-photo-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #e3f2fd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        .member-photo-placeholder .material-icons { font-size: 48px; color: #90caf9; }

        .member-name { font-size: 1rem; font-weight: 500; color: #333; margin-bottom: 4px; }
        .member-designation {
            font-size: 0.8rem;
            font-weight: 500;
            color: #1976d2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Login Button */
        .login-section {
            text-align: center;
            margin-top: 40px;
            padding: 30px 20px;
            background: #f5f5f5;
            border-radius: 12px;
        }
        .login-section p { color: #666; margin-bottom: 16px; font-size: 0.9rem; }
        .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1976d2;
            color: white;
            padding: 12px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .login-btn:hover { background: #1565c0; }
        .login-btn .material-icons { font-size: 20px; }

        /* Footer */
        .footer {
            background: #263238;
            color: #b0bec5;
            text-align: center;
            padding: 24px 20px;
            font-size: 0.8rem;
        }
        .footer .society-name { color: white; font-weight: 500; margin-bottom: 4px; }
        .footer .copyright { margin-top: 8px; opacity: 0.7; }

        /* Loading State */
        .loading { text-align: center; padding: 40px; color: #999; }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5rem; }
            .header { padding: 30px 16px; }
            .main { padding: 24px 16px; }
            .member-card, .member-card.top-member { width: 160px; padding: 16px 12px; }
            .member-photo, .member-photo-placeholder { width: 80px; height: 80px; }
            .member-photo-placeholder .material-icons { font-size: 36px; }
            .section-title { font-size: 1.2rem; }
        }

        @media (max-width: 480px) {
            .member-card, .member-card.top-member { width: 140px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1 id="societyName">Loading...</h1>
        <div class="reg-number" id="regNumber"></div>
        <div class="address" id="societyAddress"></div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <h2 class="section-title">Management Committee</h2>

        <!-- Top Row: Chairman, Secretary, Treasurer -->
        <div class="top-row" id="topRow">
            <div class="loading">Loading committee members...</div>
        </div>

        <!-- Other Members -->
        <div class="committee-grid" id="otherMembers"></div>

        <!-- Login Section -->
        <div class="login-section">
            <p>Society members can login to access maintenance bills, payments, and more.</p>
            <a href="/app/member-login" class="login-btn">
                <span class="material-icons">login</span>
                Member Login
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="society-name" id="footerSocietyName"></div>
        <div id="footerAddress"></div>
        <div class="copyright">&copy; <span id="currentYear"></span> All Rights Reserved.</div>
    </footer>

    <script>
        const API_BASE = '/api';

        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // Load Society Settings
        fetch(`${API_BASE}/settings/public`)
            .then(res => res.json())
            .then(data => {
                if (data.success && data.data) {
                    const s = data.data;
                    document.getElementById('societyName').textContent = s.societyName || 'Society Management';
                    document.getElementById('regNumber').textContent = s.registrationNumber ? `Reg. No: ${s.registrationNumber}` : '';
                    const addr = [s.addressLine1, s.addressLine2, s.city, s.state, s.pincode].filter(Boolean).join(', ');
                    document.getElementById('societyAddress').textContent = addr;
                    document.getElementById('footerSocietyName').textContent = s.societyName || '';
                    document.getElementById('footerAddress').textContent = addr;
                    document.title = s.societyName || 'Society Management';
                }
            })
            .catch(() => {
                document.getElementById('societyName').textContent = 'Society Management';
            });

        // Load Committee Members
        fetch(`${API_BASE}/committee-members/public`)
            .then(res => res.json())
            .then(data => {
                if (data.success && data.data) {
                    renderCommittee(data.data);
                } else {
                    document.getElementById('topRow').innerHTML = '<p style="color:#999">No committee members found.</p>';
                }
            })
            .catch(() => {
                document.getElementById('topRow').innerHTML = '<p style="color:#999">Unable to load committee members.</p>';
            });

        function renderCommittee(members) {
            // Top positions: Chairman, Secretary, Treasurer (display order 1, 2, 3)
            const topDesignations = ['chairman', 'secretary', 'treasurer'];
            const topMembers = [];
            const otherMembers = [];

            members.forEach(m => {
                const desig = m.designation.toLowerCase();
                if (topDesignations.some(d => desig.includes(d))) {
                    topMembers.push(m);
                } else {
                    otherMembers.push(m);
                }
            });

            // Sort top members: Chairman first, then Secretary, then Treasurer
            topMembers.sort((a, b) => {
                const order = d => {
                    const dl = d.designation.toLowerCase();
                    if (dl.includes('chairman')) return 0;
                    if (dl.includes('secretary')) return 1;
                    if (dl.includes('treasurer')) return 2;
                    return 3;
                };
                return order(a) - order(b);
            });

            const topRowEl = document.getElementById('topRow');
            topRowEl.innerHTML = topMembers.map(m => createMemberCard(m, true)).join('');

            const otherEl = document.getElementById('otherMembers');
            otherEl.innerHTML = otherMembers.map(m => createMemberCard(m, false)).join('');
        }

        function createMemberCard(member, isTop) {
            const photoHtml = member.photoPath
                ? `<img src="${API_BASE}/files/view/${member.photoPath}" class="member-photo" alt="${member.fullName}">`
                : `<div class="member-photo-placeholder"><span class="material-icons">person</span></div>`;

            return `
                <div class="member-card ${isTop ? 'top-member' : ''}">
                    ${photoHtml}
                    <div class="member-name">${member.fullName}</div>
                    <div class="member-designation">${member.designation}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
