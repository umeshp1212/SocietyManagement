server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for PWA
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # HTTPS redirect for production PWA (uncomment in production)
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }

    # Gzip compression including manifest
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/manifest+json;
    gzip_min_length 1000;

    # API proxy to backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        client_max_body_size 10M;
    }

    # Service Worker - must be served with correct headers
    location = /ngsw.json {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    location = /ngsw-worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Web App Manifest with correct content-type
    location = /manifest.json {
        add_header Content-Type application/manifest+json;
        expires 1d;
    }

    # PWA Icons - cache for better performance
    location /assets/icons/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular SPA - fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # No cache for HTML files to ensure PWA updates
        location ~ \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # Cache static assets (except HTML)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
