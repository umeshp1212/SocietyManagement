spring:
  application:
    name: society-management

  datasource:
    url: jdbc:mysql://localhost:3306/society_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:db/data.sql

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

# Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Logging
logging:
  level:
    com.society: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# File upload directory
app:
  upload:
    dir: ./uploads
  jwt:
    secret: MySuperSecretKeyForJwtTokenGenerationMustBeLongEnough12345678
    expiration: 86400000
    refresh-expiration: 604800000
  cashfree:
    app-id: 
    secret-key: 
    api-version: 2023-08-01
    environment: sandbox
    return-url: http://localhost:4200/maintenance/payment-status
    notify-url: http://localhost:8080/api/maintenance/payments/webhook
  base-url: http://localhost:8080/api
