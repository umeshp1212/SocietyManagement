version: '3.8'

services:
  # =============================================================
  # MySQL Database
  # =============================================================
  mysql:
    image: mysql:8.0
    container_name: society-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: society_management
      MYSQL_USER: ${DB_USERNAME:-society_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CDwing@2019}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - society-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =============================================================
  # Spring Boot Backend (prod profile)
  # =============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: society-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Activate the production profile (application-prod.yml)
      SPRING_PROFILES_ACTIVE: prod

      # ---- Database (override localhost -> mysql service) ----
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/society_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME:-society_app}
      DB_PASSWORD: ${DB_PASSWORD:-CDwing@2019}

      # ---- Writable paths inside the container (mapped to volumes) ----
      APP_UPLOAD_DIR: /app/uploads
      LOGGING_FILE_PATH: /app/logs
      LOGGING_FILE_NAME: /app/logs/society-management.log

      # ---- Security / tokens ----
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

      # ---- Email (Gmail SMTP) ----
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      # ---- Payment gateways ----
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENVIRONMENT: ${CASHFREE_ENVIRONMENT:-sandbox}
      CASHFREE_RETURN_URL: ${CASHFREE_RETURN_URL:-https://ppvcd.in/maintenance/payment-status}
      CASHFREE_NOTIFY_URL: ${CASHFREE_NOTIFY_URL:-https://ppvcd.in/api/member/payments/webhook/cashfree}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

      # ---- App URLs ----
      APP_BASE_URL: ${APP_BASE_URL:-https://ppvcd.in/api}
      FRONTEND_URL: ${FRONTEND_URL:-https://ppvcd.in}
      # Admin SPA now lives at the site root (not /app). Keep this EMPTY so
      # backend-built links (e.g. password-reset emails) point at https://ppvcd.in/...
      FRONTEND_BASE_PATH: ${FRONTEND_BASE_PATH:-}
    volumes:
      - uploads_data:/app/uploads
      - backend_logs:/app/logs
    networks:
      - society-network
    # Not published to the host — only nginx reaches it over the compose network.
    expose:
      - "8080"

  # =============================================================
  # Nginx: TLS termination + both Angular frontends + /api proxy
  #   /         -> admin + public landing
  #   /member/  -> member PWA
  #   /api/     -> backend container
  # =============================================================
  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile
    container_name: society-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the host's Let's Encrypt certs read-only so certbot keeps renewing them.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for ACME HTTP-01 challenge renewals.
      - certbot_webroot:/var/www/certbot
    networks:
      - society-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  backend_logs:
    driver: local
  certbot_webroot:
    driver: local

networks:
  society-network:
    driver: bridge
